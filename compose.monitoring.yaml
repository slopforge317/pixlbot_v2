name: pixlbot-monitoring

services:
  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-pixlbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pixlbot}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    profiles:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - prometheus_data:/prometheus
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - loki_data:/loki
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    profiles:
      - monitoring
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:12345:12345
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    profiles:
      - monitoring
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-pixlbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pixlbot}?sslmode=disable
    command:
      - --extend.query-path=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./infra/monitoring/postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  alloy_data:
