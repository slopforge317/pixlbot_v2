name: pixlbot-next-test

x-backend-environment: &backend-environment
  BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env.test}
  TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
  TELEGRAM_TEST_MODE: ${TELEGRAM_TEST_MODE:-false}
  TMA_URL: ${TMA_URL:-https://tma.pixlbot.ru}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pixlbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:-pixlbot}
  WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook/telegram}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env.test}
  KIE_API_KEY: ${KIE_API_KEY:-}
  KIE_API_BASE_URL: ${KIE_API_BASE_URL:-https://api.kie.ai}
  KIE_POLL_INTERVAL: ${KIE_POLL_INTERVAL:-3.0}
  KIE_POLL_TIMEOUT: ${KIE_POLL_TIMEOUT:-300.0}
  KIE_CALLBACK_ENABLED: ${KIE_CALLBACK_ENABLED:-false}
  KIE_CALLBACK_SECRET: ${KIE_CALLBACK_SECRET:?Set KIE_CALLBACK_SECRET in .env.test}
  INIT_DATA_EXPIRE_SECONDS: ${INIT_DATA_EXPIRE_SECONDS:-3600}
  WELCOME_BONUS_CREDITS: ${WELCOME_BONUS_CREDITS:-5}
  FUNNEL_ENABLED: ${FUNNEL_ENABLED:-false}
  PAYMENT_CLEANUP_ENABLED: ${PAYMENT_CLEANUP_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_DIR: ${LOG_DIR:-logs}
  LOG_ROTATION: ${LOG_ROTATION:-10 MB}
  LOG_RETENTION: ${LOG_RETENTION:-14 days}
  LOG_JSON: ${LOG_JSON:-true}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
  S3_REGION: ${S3_REGION:-ru-central1}
  S3_UPLOAD_MAX_SIZE_BYTES: ${S3_UPLOAD_MAX_SIZE_BYTES:-10485760}
  S3_PRESIGN_UPLOAD_EXPIRES: ${S3_PRESIGN_UPLOAD_EXPIRES:-600}
  S3_PRESIGN_DOWNLOAD_EXPIRES: ${S3_PRESIGN_DOWNLOAD_EXPIRES:-3600}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://tma.pixlbot.ru/packages?payment=success}

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixlbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
      POSTGRES_DB: ${POSTGRES_DB:-pixlbot}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pixlbot} -d ${POSTGRES_DB:-pixlbot}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    command:
      - sh
      - -c
      - python scripts/seed_db.py && python scripts/seed_packages.py
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  db-legacy:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    entrypoint:
      - python
      - scripts/adopt_legacy_schema.py
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  backend:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    expose:
      - "8000"
    volumes:
      - backend_test_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tma:
    build:
      context: ./apps/tma
      args:
        VITE_API_URL: /api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-tma.pixlbot.ru}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_test_data:/data
      - caddy_test_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_test_data:
  backend_test_logs:
  caddy_test_data:
  caddy_test_config:
