name: pixlbot-next-test

x-backend-environment: &backend-environment
  BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env.test}
  TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
  TELEGRAM_TEST_MODE: ${TELEGRAM_TEST_MODE:-false}
  TMA_URL: ${TMA_URL:-https://tma.pixlbot.ru}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pixlbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:-pixlbot}
  WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook/telegram}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env.test}
  KIE_API_KEY: ${KIE_API_KEY:-}
  KIE_API_BASE_URL: ${KIE_API_BASE_URL:-https://api.kie.ai}
  KIE_POLL_INTERVAL: ${KIE_POLL_INTERVAL:-3.0}
  KIE_POLL_TIMEOUT: ${KIE_POLL_TIMEOUT:-300.0}
  KIE_CALLBACK_ENABLED: ${KIE_CALLBACK_ENABLED:-false}
  KIE_CALLBACK_SECRET: ${KIE_CALLBACK_SECRET:?Set KIE_CALLBACK_SECRET in .env.test}
  KIE_WEBHOOK_HMAC_KEY: ${KIE_WEBHOOK_HMAC_KEY:-}
  KIE_WEBHOOK_MAX_AGE_SECONDS: ${KIE_WEBHOOK_MAX_AGE_SECONDS:-300}
  KIE_RECONCILIATION_INTERVAL_SECONDS: ${KIE_RECONCILIATION_INTERVAL_SECONDS:-60}
  KIE_RECONCILIATION_STALE_SECONDS: ${KIE_RECONCILIATION_STALE_SECONDS:-60}
  KIE_RECONCILIATION_BATCH_SIZE: ${KIE_RECONCILIATION_BATCH_SIZE:-100}
  INIT_DATA_EXPIRE_SECONDS: ${INIT_DATA_EXPIRE_SECONDS:-3600}
  WELCOME_BONUS_CREDITS: ${WELCOME_BONUS_CREDITS:-5}
  FUNNEL_ENABLED: ${FUNNEL_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_DIR: ${LOG_DIR:-logs}
  LOG_ROTATION: ${LOG_ROTATION:-10 MB}
  LOG_RETENTION: ${LOG_RETENTION:-14 days}
  LOG_JSON: ${LOG_JSON:-true}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
  R2_REGION: ${R2_REGION:-auto}
  R2_UPLOAD_MAX_SIZE_BYTES: ${R2_UPLOAD_MAX_SIZE_BYTES:-31457280}
  R2_PRESIGN_UPLOAD_EXPIRES: ${R2_PRESIGN_UPLOAD_EXPIRES:-600}
  R2_PRESIGN_DOWNLOAD_EXPIRES: ${R2_PRESIGN_DOWNLOAD_EXPIRES:-3600}
  YOOKASSA_PROVIDER_TOKEN: ${YOOKASSA_PROVIDER_TOKEN:-}
  YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-2}
  YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
  YOOKASSA_PAYMENT_SUBJECT: ${YOOKASSA_PAYMENT_SUBJECT:-service}
  YOOKASSA_PAYMENT_MODE: ${YOOKASSA_PAYMENT_MODE:-full_payment}

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixlbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
      POSTGRES_DB: ${POSTGRES_DB:-pixlbot}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pixlbot} -d ${POSTGRES_DB:-pixlbot}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    command:
      - sh
      - -c
      - python scripts/seed_db.py && python scripts/seed_packages.py
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  db-tools:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    entrypoint:
      - python
      - scripts/database_tools.py
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  backend:
    build:
      context: ./apps/backend
    environment:
      <<: *backend-environment
    expose:
      - "8000"
    volumes:
      - backend_test_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tma:
    build:
      context: ./apps/tma
      args:
        VITE_API_URL: /api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-tma.pixlbot.ru}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_test_data:/data
      - caddy_test_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_test_data:
    name: ${POSTGRES_VOLUME_NAME:-pixlbot_v2_postgres_data}
  backend_test_logs:
    name: pixlbot_v2_backend_logs
  caddy_test_data:
    name: pixlbot_v2_caddy_data
  caddy_test_config:
    name: pixlbot_v2_caddy_config
