server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Backend application logs (JSON format)
  - job_name: pixlbot-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: pixlbot-backend
          __path__: /var/log/pixlbot/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            user_id: user_id
            job_id: job_id
            logger: logger
            message: message
            timestamp: timestamp
      - labels:
          level:
          request_id:
          user_id:
          job_id:
          logger:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000000-0700"
      - output:
          source: message

  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - react-app
              - pixlbot-api
              - pixlbot-db
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "job"
