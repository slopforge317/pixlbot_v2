# Определяем запросы с файловым расширением (для SPA 404)
map $uri $is_file_request {
    ~\.[a-zA-Z0-9]+$  1;
    default            0;
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name pixlbot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pixlbot.ru;

    # SSL
    ssl_certificate /etc/letsencrypt/live/pixlbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixlbot.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Скрыть версию nginx
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ============================================================
    # Блокировка: скрытые файлы (.env, .git, .aws, .docker и т.д.)
    # ============================================================
    location ~ /\. {
        return 404;
    }

    # ============================================================
    # Блокировка: опасные расширения файлов
    # ============================================================
    location ~* \.(env|sql|bak|backup|old|save|swp|log|key|secret|conf|ini|cfg|php|py|rb|go|java|sh|yml|yaml|tf|tfstate|properties|pem|ppk)$ {
        return 404;
    }

    # ============================================================
    # Блокировка: известные attack-пути (WordPress, Laravel и т.д.)
    # ============================================================
    location ~* (wp-config|wp-admin|wp-content|wp-includes|phpinfo|server[_-]info|artisan|cgi-bin|node_modules|phpmyadmin) {
        return 404;
    }

    # ============================================================
    # API — приоритет через ^~ (regex-блокировки не перехватят)
    # Бэкенд сам отдаёт 404 на несуществующие API-пути
    # ============================================================
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram webhook
    location ^~ /webhook/telegram {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YooKassa payment webhook
    location ^~ /webhook/yookassa {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # KIE callback webhook
    location ^~ /webhook/kie/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location ^~ /health {
        proxy_pass http://backend:8000;
    }

    # ============================================================
    # Статические файлы: отдать если существует, иначе 404
    # ============================================================
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp|avif|mp4|webm|webmanifest|json|txt|xml)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # SPA: fallback на index.html только для чистых URL (без расширения)
    # Запросы с расширением, не найденные выше — получают 404
    # ============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        if ($is_file_request) {
            return 404;
        }
        try_files /index.html =404;
    }
}

# ============================================================
# Grafana monitoring — grafana.pixlbot.ru
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name grafana.pixlbot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.pixlbot.ru;

    # SSL (use the same cert or a separate one for grafana.pixlbot.ru)
    ssl_certificate /etc/letsencrypt/live/pixlbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixlbot.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $grafana_upstream http://monitoring-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
