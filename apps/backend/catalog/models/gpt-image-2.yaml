      ui_label: Качество
      ui_order: 3
  pricing:
  - variant_values:
      resolution: 2K
    price: 3
  - variant_values:
      resolution: 4K
    price: 4
- api_model_id: gpt-image-2-image-to-image
  title: Image-to-Image
  input_mode: image_required
  sort_order: 20
  parameters:
    prompt:
      type: string
      required: true
      max_length: 20000
      ui_label: Запрос
      ui_order: 1
    input_urls:
      type: array
      required: true
      max_images: 16
      max_image_size_mb: 30
      accepted_types:
      - image/jpeg
      - image/png
      - image/webp
      - image/jpg
      ui_label: Фото для референса
      ui_order: 2
    aspect_ratio:
      type: string
      required: false
      values: *supported_aspect_ratios
      default: auto
      ui_label: Соотношение сторон
      ui_order: 3
    resolution:
      type: string
      required: true
      values: *supported_resolutions
      variant: true
      default: 2K
      ui_label: Качество
      ui_order: 4
  pricing:
  - variant_values:
      resolution: 2K
    price: 3
  - variant_values:
      resolution: 4K
    price: 4
