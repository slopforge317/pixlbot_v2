[project]
name = "pixlbot"
version = "0.1.0"
description = "Telegram bot for AI image/video generation"
authors = [
    {name = "dmitrii"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram (>=3.24.0,<4.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "alembic (>=1.13.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
isort = ">=7.0.0,<8.0.0"
black = ">=25.12.0,<26.0.0"
flake8 = ">=7.3.0,<8.0.0"
pyright = ">=1.1.408,<2.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["app"]
